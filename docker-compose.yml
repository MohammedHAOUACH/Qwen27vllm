services:
  vllm:
    # Image nightly épinglée : seule version validée pour Qwen3.8 (compressed-tensors
    # Marlin + Mamba cache aligné + MTP speculative decoding réunis).
    # Source : carte modèle lued/Qwen3.8-27B-INT8-W8A16-MTP (section "Serving").
    image: vllm/vllm-openai:nightly-ac7509e2b1db40fec2f03dde1ed4e9dfdc2338c9
    container_name: vllm-qwen38-27b-int8
    restart: unless-stopped
    # ipc: host requis pour tensor-parallel : vLLM/NCCL utilise la shared memory
    # pour le broadcast entre workers (sinon "No available shared memory broadcast block").
    ipc: host
    ports:
      - "1234:1234"
    volumes:
      # Poids du modèle (cache Hugging Face) — montés en lecture/écriture.
      - ./models:/root/.cache/huggingface/hub
      # Persistance des artefacts de compilation (torch.compile / inductor / Triton)
      # pour éviter de recompiler à chaque redémarrage (~3-4 min économisées).
      - ./cache/vllm:/root/.cache/vllm
      - ./cache/triton:/root/.triton/cache
    environment:
      # Locale UTF-8 : évite UnicodeDecodeError dans torch/_ops.py (conteneur NVIDIA en LANG=POSIX).
      - LANG=C.UTF-8
      - LC_ALL=C.UTF-8
      - PYTHONIOENCODING=utf-8
      # 2× RTX 3090 sans NVLink : profil "stock driver" recommandé par la carte modèle.
      # NCCL_P2P_DISABLE évite les stalls d'init NCCL ; --disable-custom-all-reduce (CLI)
      # désactive le custom all-reduce vLLM non supporté sans P2P.
      - NCCL_P2P_DISABLE=1
      - NCCL_IB_DISABLE=1
      - NCCL_CUMEM_ENABLE=0
      # Multiprocess spawn : requis par le chemin MTP/GDN de Qwen3.8.
      - VLLM_WORKER_MULTIPROC_METHOD=spawn
      # Recette modèle : 1 seul thread OMP, sampler FlashInfer désactivé.
      # A/B testé : VLLM_USE_FLASHINFER_SAMPLER=1 ne change rien au débit (~42-45 tok/s).
      - OMP_NUM_THREADS=1
      - VLLM_USE_FLASHINFER_SAMPLER=0
      # Allocation CUDA recommandée par la carte modèle (segments extensibles).
      - "PYTORCH_CUDA_ALLOC_CONF=expandable_segments:True,max_split_size_mb:512"
      - HF_TOKEN=${HF_TOKEN:-}
      - VLLM_LOGGING_LEVEL=INFO
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 2
              capabilities: [gpu]
    command:
      - --model
      - lued/Qwen3.8-27B-INT8-W8A16-MTP
      - --served-model-name
      - qwen3.8-27b-int8-w8a16
      - --tensor-parallel-size
      - "2"
      - --pipeline-parallel-size
      - "1"
      # Ampere (sm_86) : W8A16 = poids INT8 reconstruits en BF16 (pas de FP8 natif).
      - --dtype
      - bfloat16
      - --performance-mode
      - balanced
      # Contexte natif du modèle (262 144 tokens).
      - --max-model-len
      - "262144"
      - --gpu-memory-utilization
      - "0.92"
      # Concurrence : 2 seqs = commande recommandée. ⚠️ Le multi-stream peut encore
      # crasher le moteur sur ce pin (vllm#50021 non mergé) ; si instabilité,
      # descendre à 1 (= config pleinement validée).
      - --max-num-seqs
      - "2"
      # Plafonne le prefill par lots (chunking des longs prompts) — validé à 8192.
      - --max-num-batched-tokens
      - "8192"
      # KV cache FP8 E4M3 (1 octet/valeur) — requis pour tenir 256K en VRAM.
      - --kv-cache-dtype
      - fp8_e4m3
      # Prefix caching OFF par défaut : sur GDN+MTP il peut corrompre le KV récurrent
      # (vllm#48375) sauf patch source. On le laisse désactivé.
      - --no-enable-prefix-caching
      - --enable-chunked-prefill
      # Requis par le chemin MTP/GDN de Qwen3.8.
      - --mamba-cache-mode
      - align
      - --prefix-match-unit
      - "16"
      - --enable-prompt-tokens-details
      - --enable-per-request-metrics
      - --reasoning-parser
      - qwen3
      - --tool-call-parser
      - qwen3_coder
      - --enable-auto-tool-choice
      # Désactive custom_all_reduce (non supporté sans P2P/NVLink sur 3090).
      - --disable-custom-all-reduce
      - --trust-remote-code
      # Thinking OFF par défaut (gain de ~3-5× en vitesse).
      # Par requête, le client peut activer un thinking réduit via :
      #   "reasoning_effort": "low"   ou
      #   "chat_template_kwargs": {"enable_thinking": true}
      - --default-chat-template-kwargs
      - '{"enable_thinking":false}'
      - --override-generation-config
      - '{"temperature":1.0,"top_p":0.95,"top_k":20,"min_p":0.0,"repetition_penalty":1.0,"presence_penalty":0.0}'
      # MTP : 3 tokens spéculatifs (acceptation mesurée ~65 %, débit ~42-45 tok/s mesuré).
      # A/B testé : 2 tokens = ~10 % plus lent (~40 tok/s). Garder 3.
      - --speculative-config
      - '{"method":"mtp","num_speculative_tokens":3}'
      - --host
      - 0.0.0.0
      - --port
      - "1234"
