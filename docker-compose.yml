services:
  vllm:
    # Image vLLM construite localement avec le support DFlash2 (PR vllm#52816,
    # non mergée) : speculative decoding par block-diffusion (drafter séparé).
    # À construire une fois avec : ./build-dflash-image.sh
    image: vllm-openai:dflash2-pr52816
    container_name: vllm-qwen38-27b-int8
    restart: unless-stopped
    # ipc: host requis pour tensor-parallel : vLLM/NCCL utilise la shared memory
    # pour le broadcast entre workers (sinon "No available shared memory broadcast block").
    ipc: host
    ports:
      - "1234:1234"
    volumes:
      # Poids du modèle (cache Hugging Face) — montés en lecture/écriture.
      - ./models:/root/.cache/huggingface/hub
      # Persistance des artefacts de compilation (torch.compile / inductor / Triton)
      # pour éviter de recompiler à chaque redémarrage (~3-4 min économisées).
      - ./cache/vllm:/root/.cache/vllm
      - ./cache/triton:/root/.triton/cache
    environment:
      # Locale UTF-8 : évite UnicodeDecodeError dans torch/_ops.py (conteneur NVIDIA en LANG=POSIX).
      - LANG=C.UTF-8
      - LC_ALL=C.UTF-8
      - PYTHONIOENCODING=utf-8
      # 2× RTX 3090 sans NVLink : profil "stock driver" recommandé par la carte modèle.
      # NCCL_P2P_DISABLE évite les stalls d'init NCCL ; --disable-custom-all-reduce (CLI)
      # désactive le custom all-reduce vLLM non supporté sans P2P.
      - NCCL_P2P_DISABLE=1
      - NCCL_IB_DISABLE=1
      - NCCL_CUMEM_ENABLE=0
      # Multiprocess spawn : requis par le chemin GDN/Mamba de Qwen3.8.
      - VLLM_WORKER_MULTIPROC_METHOD=spawn
      # Recette modèle : 1 seul thread OMP, sampler FlashInfer désactivé.
      # A/B testé : VLLM_USE_FLASHINFER_SAMPLER=1 ne change rien au débit (~42-45 tok/s).
      - OMP_NUM_THREADS=1
      - VLLM_USE_FLASHINFER_SAMPLER=0
      # Allocation CUDA recommandée par la carte modèle (segments extensibles).
      - "PYTORCH_CUDA_ALLOC_CONF=expandable_segments:True,max_split_size_mb:512"
      - HF_TOKEN=${HF_TOKEN:-}
      - VLLM_LOGGING_LEVEL=INFO
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 2
              capabilities: [gpu]
    command:
      # Modèle cible (vérifieur). On garde l'INT8 W8A16 : c'est la seule version
      # 27B qui tient en 48 Go (2× 3090). Ses têtes MTP sont chargées mais
      # inutilisées tant que method=dflash (le drafter DFlash2 les remplace).
      - --model
      - lued/Qwen3.8-27B-INT8-W8A16-MTP
      - --served-model-name
      - qwen3.8-27b-int8-w8a16
      - --tensor-parallel-size
      - "2"
      - --pipeline-parallel-size
      - "1"
      # Ampere (sm_86) : W8A16 = poids INT8 reconstruits en BF16 (pas de FP8 natif).
      - --dtype
      - bfloat16
      - --performance-mode
      - balanced
      # Contexte max réellement servable (mesuré) : 121 952 tokens.
      # Le natif de Qwen3.8 (262 144) ne tient pas : avec le drafter DFlash2
      # séparé (~3.9 Go BF16), il ne reste que ~3.15 GiB de KV cache par GPU
      # (2× 24 Go) alors qu'il en faudrait 5.84 GiB pour 256 K. vLLM estime le
      # max à 121 952 tokens ; au-delà il refuse de démarrer (ValueError).
      - --max-model-len
      - "121952"
      - --gpu-memory-utilization
      - "0.92"
      # Concurrence : 2 seqs = commande recommandée. ⚠️ Le multi-stream peut encore
      # crasher le moteur sur ce pin (vllm#50021 non mergé) ; si instabilité,
      # descendre à 1 (= config pleinement validée).
      - --max-num-seqs
      - "2"
      # Plafonne le prefill par lots (chunking des longs prompts) — validé à 8192.
      - --max-num-batched-tokens
      - "8192"
      # KV cache FP8 E4M3 (1 octet/valeur) — requis pour tenir 256K en VRAM.
      - --kv-cache-dtype
      - fp8_e4m3
      # Prefix caching REACTIVE (test) : avec le contexte qui grossit a chaque
      # etape, le re-prefill integral etait le goulot (~4 min/requete).
      # ⚠️ vllm#48375 : risque de corruption du KV recurrent GDN — a surveiller.
      - --enable-prefix-caching
      - --enable-chunked-prefill
      # Requis par le chemin GDN/Mamba de Qwen3.8 (modèle cible hybride).
      - --mamba-cache-mode
      - align
      - --prefix-match-unit
      - "16"
      - --enable-prompt-tokens-details
      - --enable-per-request-metrics
      - --reasoning-parser
      - qwen3
      - --tool-call-parser
      - qwen3_coder
      - --enable-auto-tool-choice
      # Désactive custom_all_reduce (non supporté sans P2P/NVLink sur 3090).
      - --disable-custom-all-reduce
      - --trust-remote-code
      # Thinking OFF par défaut (gain de ~3-5× en vitesse).
      # Par requête, le client peut activer un thinking réduit via :
      #   "reasoning_effort": "low"   ou
      #   "chat_template_kwargs": {"enable_thinking": true}
      - --default-chat-template-kwargs
      - '{"enable_thinking":false}'
      - --override-generation-config
      - '{"temperature":1.0,"top_p":0.95,"top_k":20,"min_p":0.0,"repetition_penalty":1.0,"presence_penalty":0.0}'
      # DFlash2 : speculative decoding par block-diffusion. Le drafter
      # z-lab/Qwen3.8-27B-DFlash2 (~1.9B param BF16, ~3.9 Go, téléchargé depuis
      # HF au 1er démarrage) propose un bloc de tokens en un seul passage ;
      # 7 tokens spéculatifs par étape (block_size 8). Décodage lossless.
      # method=dflash : le speculator DFlash2 est sélectionné automatiquement
      # car l'architecture du drafter est DFlash2DraftModel.
      # Source : https://huggingface.co/z-lab/Qwen3.8-27B-DFlash2
      - --speculative-config
      - '{"method":"dflash","model":"z-lab/Qwen3.8-27B-DFlash2","num_speculative_tokens":7}'
      - --host
      - 0.0.0.0
      - --port
      - "1234"

  # ─────────────────────────────────────────────────────────────────────────
  # Interface web (Open WebUI) : chat + RAG, connectée à l'API OpenAI-compatible
  # vLLM via le réseau Docker interne (service « vllm »).
  # Source : https://docs.vllm.ai/en/latest/deployment/frameworks/open-webui/
  # ─────────────────────────────────────────────────────────────────────────
  open-webui:
    image: ghcr.io/open-webui/open-webui:main
    container_name: open-webui
    restart: unless-stopped
    ports:
      - "3000:8080"
    volumes:
      # Persistance des données (comptes, conversations, fichiers RAG).
      - open-webui:/app/backend/data
    environment:
      # URL de base de l'API OpenAI-compatible vLLM (résolue via le réseau Docker).
      - OPENAI_API_BASE_URL=http://vllm:1234/v1
      # Clé arbitraire : vLLM n'authentifie pas, mais Open WebUI en exige une.
      - OPENAI_API_KEY=vllm
    depends_on:
      - vllm

volumes:
  open-webui:
